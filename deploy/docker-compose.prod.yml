# Production / staging stack: TLS termination (Caddy), no database port exposed, secrets required.
#
#   cp deploy/.env.prod.example deploy/.env      # fill every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Use a separate .env (and DOMAIN) for staging.

name: horeca

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  APP_ENV: production
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY (32+ random characters)}
  CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN}
  DEFAULT_PLAN: ${DEFAULT_PLAN:-trial}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-HoReCa Platform <no-reply@localhost>}
  APP_BASE_URL: https://${DOMAIN}
  TRIAL_DAYS: ${TRIAL_DAYS:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  INVOICE_AI_MODEL: ${INVOICE_AI_MODEL:-claude-opus-5-5}
  INVOICE_INBOX_ADDRESS: ${INVOICE_INBOX_ADDRESS:-}
  IMAP_HOST: ${IMAP_HOST:-}
  IMAP_PORT: ${IMAP_PORT:-993}
  IMAP_USER: ${IMAP_USER:-}
  IMAP_PASSWORD: ${IMAP_PASSWORD:-}
  IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ../backend
    restart: unless-stopped
    env_file:
      - path: ./pos-secrets.env   # POS API secrets referenced as env:NAME (optional)
        required: false
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: ../backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file:
      - path: ./pos-secrets.env   # POS API secrets referenced as env:NAME (optional)
        required: false
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

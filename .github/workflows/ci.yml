name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horeca
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: horeca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horeca -d horeca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://horeca:change-me@localhost:5432/horeca_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational until the baseline is clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horeca
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: horeca_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horeca -d horeca_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://horeca:change-me@localhost:5432/horeca_e2e
      JWT_SECRET_KEY: ci-e2e-secret-key-that-is-long-enough-123
      CORS_ORIGINS: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: Build and serve the frontend
        working-directory: frontend
        run: |
          npm ci
          VITE_API_URL=http://localhost:8000/api npm run build
          nohup npx vite preview --port 4173 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4173 >/dev/null && break; sleep 1; done
      - name: Browser smoke test
        working-directory: e2e
        run: |
          npm init -y >/dev/null
          npm install playwright-core
          CHROMIUM_PATH="$(which google-chrome || which chromium-browser || which chromium)" node smoke.mjs | tee ../smoke.log
          ! grep -q '^FAIL' ../smoke.log
      - name: Show API log on failure
        if: failure()
        run: tail -n 100 api.log

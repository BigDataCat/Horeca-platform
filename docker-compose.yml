services:
  postgres:
    image: postgres:16-alpine
    container_name: horeca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-horeca}
      POSTGRES_USER: ${POSTGRES_USER:-horeca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horeca} -d ${POSTGRES_DB:-horeca}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
